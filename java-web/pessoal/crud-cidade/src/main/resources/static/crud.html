<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CRUD Cidades</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid">
    <div class="jumbotron mt-5">
        <h1>GERENCIAMENTO DE CIDADES</h1>
        <p>UM CRUD PARA CRIAR, ALTERAR, EXCLUIR E LISTAR CIDADES</p>
    </div>
    <form>
        <div class="form-group">
            <label for="nome">Cidade:</label>
            <input type="text" class="form-control" placeholder="Informe o nome da cidade" id="nome">
        </div>

        <div class="form-group">
            <label for="estado">Estado:</label>
            <input type="text" class="form-control" placeholder="Informe o estado que a cidade pertence" id="estado">
        </div>

        <button type="submit" class="btn btn-primary">CRIAR</button>
    </form>

    <table class="table table-striped table-hover mt-5">
        <thead class="thead-dark">
        <tr>
            <th>Nome</th>
            <th>Estado</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>Londrina</td>
            <td>Paraná</td>
            <td>
                <div class="d-flex justify-content-center">
                    <a href="" class="btn btn-warning mr-3">ALTERAR</a>
                    <a href="" class="btn btn-danger">EXCLUIR</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
